<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C# Search</title>
    <link rel="stylesheet" href="{{cssUri}}" />
</head>

<body>
    <div class="container">
        <div id="tabs" class="tabs"></div>
        <div class="search-box">
            <input id="queryInput" type="text" />
            <button id="clearQueryBtn" class="clear-query-btn" type="button" aria-label="Clear input"
                title="Clear input">
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                    <path d="M4 4l8 8" />
                    <path d="M12 4l-8 8" />
                </svg>
            </button>
        </div>
        <div id="resultMeta" class="result-meta"></div>
        <ul id="resultList" class="result-list"></ul>
    </div>

    <script nonce="{{nonce}}" src="{{jsUri}}"></script>
</body>

</html>
